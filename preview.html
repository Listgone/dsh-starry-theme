  .shell{display:flex;height:100vh}
  .sidebar{width:236px;background:var(--bg2);border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:8px}
  .side-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--label2);font-size:14px;cursor:pointer}
  .side-item:hover{background:var(--hover)}
  .side-item.active{background:var(--hover);color:var(--accent)}
  .side-item .dot{width:16px;height:16px;border-radius:5px;background:var(--label2);opacity:.5}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--border);background:var(--panel)}
  .topbar .brand{font-weight:700;font-size:15px}
  .seg{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden}
  .seg button{background:transparent;border:0;color:var(--label2);font:inherit;font-size:12px;padding:6px 12px;cursor:pointer}
  .seg button.on{background:var(--hover);color:var(--accent)}
  .chat{flex:1;padding:24px;display:flex;flex-direction:column;gap:14px;overflow:auto;position:relative;z-index:1}
  .bubble{max-width:720px;padding:12px 16px;border-radius:14px;font-size:14px;line-height:1.7}
  .bubble.user{align-self:flex-end;background:var(--accent);color:#fff}
  .bubble.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--border)}
  .bubble.ai .code{font-family:ui-monospace,Consolas,monospace;background:var(--hover);border-radius:8px;padding:10px;margin-top:8px;font-size:13px}
  .composer{height:80px;margin:16px;border-radius:14px;background:var(--panel);border:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px}
  .composer input{flex:1;background:transparent;border:none;color:var(--label);outline:none;font-size:14px}
  .composer .send{width:38px;height:38px;border-radius:10px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer}
  .note{position:fixed;right:16px;bottom:12px;font-size:12px;color:var(--label2);z-index:2}
</style>
</head>
<body data-starry>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-item active"><span class="dot"></span>新对话</div>
      <div class="side-item"><span class="dot"></span>历史记录</div>
      <div class="side-item"><span class="dot"></span>工作区</div>
    </aside>
    <div class="main">
      <div class="topbar">
        <div class="brand">DeepSeek Harness</div>
        <div class="seg" id="themeSeg">
          <button data-theme="default">默认</button>
          <button data-theme="starry" class="on">星空蓝</button>
        </div>
      </div>
      <div class="chat">
        <div class="bubble ai">这是「星空蓝」预览：深蓝夜空、星点，右下角一只虎鲸水印（取自 DSH 应用图标）。</div>
        <div class="bubble user">文字在深色下清楚吗？</div>
        <div class="bubble ai">正文用冷白、面板比画布亮一档，对比度比官方深色主题更高。<div class="code">--dsw-alias-bg-base: transparent; /* 画布让给夜空 */</div></div>
      </div>
      <div class="composer"><input placeholder="输入消息…"><div class="send">➤</div></div>
    </div>
  </div>
  <div class="note">默认 / 星空蓝</div>
<script>
  var theme = "starry";
  function paint(){
    document.body.toggleAttribute("data-starry", theme === "starry");
    document.querySelectorAll('#themeSeg button').forEach(function(b){ b.classList.toggle('on', b.dataset.theme === theme); });
  }
  document.getElementById('themeSeg').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return; theme = b.dataset.theme; paint();
  });
  paint();
</script>
</body>
</html>
